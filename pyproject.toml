[project]
name = "deepwiki"
version = "2.0.0"
description = "Self-hosted Wiki generator for private code repositories."
license = {text = "MIT License"}
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.21.1",
    "pydantic>=2.0.0",
    "google-generativeai>=0.3.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
    "chromadb>=0.5.0",
    "langid>=1.1.6",
    "requests>=2.28.0",
    "jinja2>=3.1.2",
    "python-dotenv>=1.0.0",
    "openai>=1.76.2",
    "ollama>=0.4.8",
    "aiohttp>=3.8.4",
    "boto3>=1.34.0",
    "websockets>=11.0.3",
    "azure-identity>=1.12.0",
    "azure-core>=1.24.0",
    "backoff>=2.2.1",
]

[tool.uv]
package = false

# Intel Mac doesn't have onnxruntime wheels for newer versions.
# Pin to the last version with x86_64 macOS support.
constraint-dependencies = ["onnxruntime==1.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
